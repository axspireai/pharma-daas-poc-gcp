name: Deploy approvals-subscriber to Cloud Run

on:
  push:
    branches: [develop, test, prod]   # only run on these branches

jobs:
  deploy-approvals-subscriber:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push approvals-subscriber image
        run: |
          IMAGE="us-central1-docker.pkg.dev/pharma-daas-poc/daas-repo/approvals-subscriber:${{ github.ref_name }}-${{ github.sha }}"
          docker build -t $IMAGE ./approvals-subscriber
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy approvals-subscriber
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: approvals-subscriber-${{ github.ref_name }}
          image: ${{ env.IMAGE }}
          region: us-central1
          flags: --no-allow-unauthenticated
